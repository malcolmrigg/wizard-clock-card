name: CI

on:
  pull_request:

jobs:
  pre-commit:
    uses: genebean/.github/.github/workflows/pre-commit-nix.yml@main
    with:
      npm-install: true

  nix-build:
    uses: genebean/.github/.github/workflows/nix-build.yml@main
    with:
      npmDepsHash-glob: flake.nix

  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Install npm dependencies
        run: nix develop --command npm ci
      - name: Type check
        run: nix develop --command npm run typecheck

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5.0.0

  # hacs/action validates hacs.json and confirms the card JS file is present.
  # Note: hassfest (home-assistant/actions) validates Python integrations
  # (custom_components) and is not applicable to Lovelace cards.
  hacs-validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: plugin
